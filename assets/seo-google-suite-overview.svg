<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="hub" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#1a3a8f"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="640" fill="#0b1024"/>

  <!-- Hub -->
  <circle cx="600" cy="320" r="90" fill="url(#hub)"/>
  <text x="600" y="312" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">SEO Google Suite</text>
  <text x="600" y="336" text-anchor="middle" fill="#cfe0ff" font-size="13">MCP</text>

  <!-- Client boxes (left) -->
  <g font-size="15" fill="#ffffff">
    <g>
      <rect x="40" y="60" width="230" height="60" rx="8" fill="#171c33" stroke="#3a4570"/>
      <text x="60" y="97" font-weight="600">Codex</text>
      <line x1="270" y1="90" x2="510" y2="260" stroke="#4f8cff" stroke-width="2"/>
    </g>
    <g>
      <rect x="40" y="140" width="230" height="60" rx="8" fill="#171c33" stroke="#3a4570"/>
      <text x="60" y="177" font-weight="600">Claude Code</text>
      <line x1="270" y1="170" x2="512" y2="290" stroke="#e07a3f" stroke-width="2"/>
    </g>
    <g>
      <rect x="40" y="220" width="230" height="60" rx="8" fill="#171c33" stroke="#3a4570"/>
      <text x="60" y="257" font-weight="600">Cursor</text>
      <line x1="270" y1="250" x2="512" y2="320" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g>
      <rect x="40" y="300" width="230" height="60" rx="8" fill="#171c33" stroke="#3a4570"/>
      <text x="60" y="337" font-weight="600">VS Code</text>
      <line x1="270" y1="330" x2="512" y2="350" stroke="#3f8fe0" stroke-width="2"/>
    </g>
    <g>
      <rect x="40" y="380" width="230" height="60" rx="8" fill="#171c33" stroke="#3a4570"/>
      <text x="60" y="417" font-weight="600">OpenClaw</text>
      <line x1="270" y1="410" x2="512" y2="380" stroke="#7fd97a" stroke-width="2"/>
    </g>
    <g>
      <rect x="40" y="460" width="230" height="60" rx="8" fill="#171c33" stroke="#3a4570"/>
      <text x="60" y="497" font-weight="600">Hermes</text>
      <line x1="270" y1="490" x2="512" y2="360" stroke="#d97ad9" stroke-width="2"/>
    </g>
  </g>

  <!-- Service boxes (right) -->
  <g font-size="15" fill="#0b1024">
    <g>
      <rect x="930" y="90" width="230" height="70" rx="8" fill="#ffffff"/>
      <text x="950" y="120" font-weight="600">Google Search Console</text>
      <text x="950" y="142" font-size="12" fill="#5b6480">gsc-mcp</text>
      <line x1="930" y1="125" x2="690" y2="290" stroke="#4285F4" stroke-width="2"/>
    </g>
    <g>
      <rect x="930" y="180" width="230" height="70" rx="8" fill="#ffffff"/>
      <text x="950" y="210" font-weight="600">Google Analytics 4</text>
      <text x="950" y="232" font-size="12" fill="#5b6480">analytics-mcp</text>
      <line x1="930" y1="215" x2="690" y2="315" stroke="#f4b400" stroke-width="2"/>
    </g>
    <g>
      <rect x="930" y="270" width="230" height="70" rx="8" fill="#ffffff"/>
      <text x="950" y="300" font-weight="600">Chrome UX Report</text>
      <text x="950" y="322" font-size="12" fill="#5b6480">CrUX helper</text>
      <line x1="930" y1="305" x2="690" y2="330" stroke="#0f9d58" stroke-width="2"/>
    </g>
  </g>

  <!-- OS row -->
  <g font-size="14" fill="#cfd6ee">
    <text x="480" y="600" text-anchor="middle">Windows</text>
    <text x="600" y="600" text-anchor="middle">macOS</text>
    <text x="720" y="600" text-anchor="middle">Linux</text>
    <line x1="600" y1="410" x2="480" y2="580" stroke="#3a4570" stroke-dasharray="4 4"/>
    <line x1="600" y1="410" x2="600" y2="580" stroke="#3a4570" stroke-dasharray="4 4"/>
    <line x1="600" y1="410" x2="720" y2="580" stroke="#3a4570" stroke-dasharray="4 4"/>
  </g>
</svg>
